<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Agent 虛擬辦公室</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：全螢幕 3D 場景當底，介面是浮在上面的面板（上方工具列、左側清單、右側詳情） */
:root {
  --bg: #dfe9ef;
  --panel: rgba(250, 252, 253, .92);
  --panel-solid: #fafcfd;
  --line: #cfdae1;
  --ink: #15242f;
  --ink-2: #51636f;
  --accent: #0e6f8a;
  --accent-ink: #ffffff;
  --accent-soft: #d8ecf2;
  --chip: #e6eef2;
  --shadow: 0 6px 24px rgba(20, 45, 60, .16);
  --s-build: #23946a; --s-plan: #3279c0; --s-review: #7658c4;
  --s-wait: #d37a12; --s-stuck: #cf3f3f; --s-queue: #9a8440; --s-idle: #7d8a93;
  --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1820; --panel: rgba(20, 32, 41, .92); --panel-solid: #142029; --line: #2b3d49;
    --ink: #e8f0f4; --ink-2: #9db0bc; --accent: #4fb6d1; --accent-ink: #06222b; --accent-soft: #173845;
    --chip: #1f303b; --shadow: 0 6px 24px rgba(0, 0, 0, .45);
    --s-build: #4cc493; --s-plan: #6aa9e6; --s-review: #a48cf0;
    --s-wait: #f0a23c; --s-stuck: #f06a6a; --s-queue: #c9b064; --s-idle: #93a1ab;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1820; --panel: rgba(20, 32, 41, .92); --panel-solid: #142029; --line: #2b3d49;
  --ink: #e8f0f4; --ink-2: #9db0bc; --accent: #4fb6d1; --accent-ink: #06222b; --accent-soft: #173845;
  --chip: #1f303b; --shadow: 0 6px 24px rgba(0, 0, 0, .45);
  --s-build: #4cc493; --s-plan: #6aa9e6; --s-review: #a48cf0;
  --s-wait: #f0a23c; --s-stuck: #f06a6a; --s-queue: #c9b064; --s-idle: #93a1ab;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#app { position: relative; height: 100%; overflow: hidden; }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#labels { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); backdrop-filter: blur(8px); }

/* 上方工具列 */
#top { position: absolute; top: 12px; left: var(--gl); right: var(--gr); display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-start; pointer-events: none; }
#top > * { pointer-events: auto; }
#brand { display: flex; align-items: center; gap: 10px; padding: 9px 14px; width: 340px; box-sizing: border-box; }
#brand h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
#src { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--chip); color: var(--ink-2); white-space: nowrap; }
#count { margin-left: auto; color: var(--ink-2); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
#tools { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.seg { display: flex; padding: 4px; gap: 2px; }
.seg button, .tool { padding: 6px 12px; border-radius: 10px; color: var(--ink-2); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.tool { padding: 10px 14px; border-radius: 14px; color: var(--ink); }

/* 左側清單 */
#side { position: absolute; left: var(--gl); top: 68px; bottom: 16px; width: 340px; display: flex; flex-direction: column; overflow: hidden; }
#sheetbar { display: none; }
#tabs { display: flex; gap: 4px; padding: 8px; }
#tabs button { flex: 1; padding: 8px; border-radius: 10px; color: var(--ink-2); font-weight: 500; }
#tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
#q { margin: 0 10px 8px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-solid); color: var(--ink); font: inherit; }
#q::placeholder { color: var(--ink-2); }
#chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 10px 8px; }
#chips button { padding: 4px 10px; border-radius: 8px; background: var(--chip); color: var(--ink-2); font-size: 13px; font-variant-numeric: tabular-nums; }
#chips button b { color: var(--ink); margin-left: 4px; }
#chips button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
#chips button[aria-pressed="true"] b { color: inherit; }
#list { flex: 1; min-height: 0; overflow-y: auto; margin: 0; padding: 0 6px 8px; list-style: none; }
#list li button { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; align-items: center; width: 100%; text-align: left; padding: 9px 8px; border-radius: 10px; }
#list li button:hover { background: var(--chip); }
#list li button[aria-current="true"] { background: var(--accent-soft); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); grid-row: 1 / 3; }
.ava { width: 34px; height: 34px; border-radius: 10px; background: var(--c); color: #fff; display: grid; place-items: center; font-weight: 700; grid-row: 1 / 3; }
.nm { font-weight: 700; font-size: 15px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nm small { font-weight: 400; color: var(--ink-2); font-size: 12px; margin-left: 6px; }
.sub { grid-column: 2; color: var(--ink-2); font-size: 12.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill { grid-row: 1 / 3; grid-column: 3; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 7px; color: var(--c); background: color-mix(in srgb, var(--c) 16%, transparent); white-space: nowrap; }
.empty { padding: 24px 12px; color: var(--ink-2); text-align: center; }
[hidden] { display: none !important; }
#note { margin: 8px 10px 0; padding: 8px 10px; border-radius: 10px; background: var(--chip); color: var(--ink-2); font-size: 13px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
#note small { flex-basis: 100%; font-size: 11.5px; opacity: .85; overflow-wrap: anywhere; }
#note button { padding: 4px 10px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-weight: 700; }

/* 右側詳情 */
#detail { position: absolute; right: calc(var(--gr) + 58px); top: 68px; width: 330px; max-width: calc(100% - var(--gl) - var(--gr)); max-height: calc(100% - 90px); overflow-y: auto; padding: 16px 18px; box-sizing: border-box; }
#detail .kind { color: var(--ink-2); font-size: 12px; }
#detail h2 { margin: 2px 32px 8px 0; font-size: 22px; line-height: 1.25; overflow-wrap: anywhere; }
#detail .x { position: absolute; right: 10px; top: 10px; width: 32px; height: 32px; border-radius: 8px; font-size: 20px; color: var(--ink-2); }
#detail .x:hover { background: var(--chip); }
#detail .state { display: inline-block; font-weight: 700; font-size: 13px; padding: 4px 10px; border-radius: 8px; color: #fff; background: var(--c); }
#detail dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 12px 0; }
#detail dt { color: var(--ink-2); }
#detail dd { margin: 0; overflow-wrap: anywhere; }
.bar { height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--c); border-radius: 3px; transition: width .4s; }
.pct { text-align: right; color: var(--ink-2); font-size: 12px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.act { display: block; box-sizing: border-box; text-align: center; text-decoration: none; margin-top: 10px; padding: 9px 14px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-weight: 700; width: 100%; }
#detail h3 { font-size: 12px; color: var(--ink-2); font-weight: 500; margin: 14px 0 6px; letter-spacing: .06em; }
.log { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 13px; }
.log time { color: var(--ink-2); font-variant-numeric: tabular-nums; margin-right: 8px; }
.links { display: flex; flex-wrap: wrap; gap: 6px; }
.links button { padding: 4px 10px; border-radius: 8px; background: var(--chip); font-size: 13px; }

/* 視角控制 */
#cam { position: absolute; right: var(--gr); top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; padding: 4px; }
#cam button { width: 40px; height: 40px; border-radius: 10px; font-size: 20px; color: var(--ink-2); }
#cam button:hover { background: var(--chip); color: var(--ink); }

/* 場景上的名牌 */
.lbl { position: absolute; left: 0; top: 0; pointer-events: auto; font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; will-change: transform; box-shadow: 0 2px 6px rgba(0, 0, 0, .25); }
.lbl.room { background: #26323a; color: #fff; border: 2px solid var(--c); display: flex; align-items: center; gap: 6px; }
.lbl.room i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.lbl.agent { background: var(--c); color: #fff; font-size: 12px; padding: 2px 9px; }
.lbl.on { outline: 3px solid #fff; }

@media (max-width: 760px) {
  #brand { width: auto; flex: 1 1 100%; }
  #tools { margin-left: 0; justify-content: flex-start; gap: 6px; }
  .seg button { padding: 5px 9px; }
  .tool { padding: 9px 11px; }
  #side { left: 0; right: 0; top: auto; bottom: 0; width: auto; height: 46%; border-radius: 16px 16px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  #side.closed { height: auto; }
  #side.closed > :not(#sheetbar) { display: none; }
  #sheetbar { display: block; width: 100%; padding: 8px; color: var(--ink-2); font-size: 13px; }
  #detail { right: var(--gr); left: var(--gl); top: 112px; width: auto; max-height: 40%; }
  #cam { top: 190px; transform: none; }
  #detail:not([hidden]) ~ #cam { display: none; }
  #cam button { width: 36px; height: 36px; }
}
</style>
</head>
<body>
<div id="app">
  <canvas id="scene" aria-label="辦公室 3D 場景，可拖曳旋轉、滾輪縮放"></canvas>
  <div id="labels"></div>

  <div id="top">
    <div id="brand" class="card">
      <h1>AI Agent 辦公室</h1>
      <span id="src">示範資料</span>
      <span id="count"></span>
    </div>
    <div id="tools">
      <div class="seg card" role="group" aria-label="場景時間">
        <button id="t-day" aria-pressed="true">白天</button>
        <button id="t-night" aria-pressed="false">夜晚</button>
      </div>
      <button id="t-pause" class="tool card" aria-pressed="false">暫停動態</button>
    </div>
  </div>

  <div id="side" class="card">
    <button id="sheetbar" aria-expanded="true">收合清單</button>
    <div id="note" hidden></div>
    <div id="tabs" role="tablist">
      <button role="tab" id="tab-p" aria-selected="true">專案</button>
      <button role="tab" id="tab-a" aria-selected="false">成員</button>
    </div>
    <input id="q" type="search" placeholder="搜尋專案名稱" aria-label="搜尋">
    <div id="chips" role="group" aria-label="狀態篩選"></div>
    <ul id="list"></ul>
  </div>

  <div id="detail" class="card" hidden></div>

  <div id="cam" class="card" role="group" aria-label="視角">
    <button id="c-in" aria-label="放大">＋</button>
    <button id="c-out" aria-label="縮小">－</button>
    <button id="c-l" aria-label="向左轉">↺</button>
    <button id="c-r" aria-label="向右轉">↻</button>
    <button id="c-home" aria-label="回到全景">⌂</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
'use strict';

/* ───────── 資料 ─────────
   預設是示範資料。同資料夾有 office-data.json（serve.mjs 會提供）就讀本機資料；
   在 claude.ai 的 Artifact 裡則透過連接器讀雲端工作階段。 */
var STATUS = {
  build:  { label: '實作中',   v: '--s-build',  hex: 0x23946a, active: true },
  plan:   { label: '計畫中',   v: '--s-plan',   hex: 0x3279c0, active: true },
  review: { label: '審查中',   v: '--s-review', hex: 0x7658c4, active: true },
  wait:   { label: '等你批准', v: '--s-wait',   hex: 0xe08a1e, active: false },
  stuck:  { label: '卡住',     v: '--s-stuck',  hex: 0xd64545, active: false },
  queue:  { label: '排隊',     v: '--s-queue',  hex: 0x9a8440, active: false },
  idle:   { label: '閒置',     v: '--s-idle',   hex: 0x7d8a93, active: false }
};
var DEMO = {
  agents: [
    { id: 'lead',   name: '總指揮', role: '派工與調度', color: '#2b3a55', gear: 'cap' },
    { id: 'fable',  name: 'Fable',  role: '長文與設計', color: '#3f9b54', gear: 'leaf' },
    { id: 'opus',   name: 'Opus',   role: '架構審查',   color: '#c0446b', gear: 'glasses' },
    { id: 'sonnet', name: 'Sonnet', role: '實作工程師', color: '#2f74d0', gear: 'antenna' },
    { id: 'haiku',  name: 'Haiku',  role: '快速雜務',   color: '#d9a21b', gear: 'bow' },
    { id: 'gemini', name: 'Gemini', role: '研究查證',   color: '#8a5bd6', gear: 'phones' },
    { id: 'codex',  name: 'Codex',  role: '獨立驗證',   color: '#d9631e', gear: 'visor' }
  ],
  projects: [
    { id: 'token-meter', name: 'token-meter', status: 'build',  task: '外援 AI 用量併入 HUD', members: ['sonnet', 'codex'], progress: 42 },
    { id: 'chip',        name: '籌碼洞察',     status: 'review', task: '比對今日位階與背離訊號', members: ['gemini', 'opus'], progress: 65 },
    { id: 'paths',       name: '隔日路徑圖',   status: 'wait',   task: '三條路徑已算好，等你按下批准', members: ['fable'], progress: 100 },
    { id: 'mail',        name: '郵件管線',     status: 'stuck',  task: '雲端硬碟回 429，重試仍失敗', members: ['sonnet'], progress: 58 },
    { id: 'monthly',     name: 'IT 月報',      status: 'plan',   task: '拆解本月簡報章節', members: ['lead', 'fable'], progress: 20 },
    { id: 'plant',       name: '新廠導入',     status: 'build',  task: '甘特資料列對帳', members: ['sonnet', 'haiku'], progress: 73 },
    { id: 'teams',       name: 'Teams 通知',   status: 'wait',   task: '催辦卡草稿已備妥，等你確認', members: ['haiku'], progress: 100 },
    { id: 'wms',         name: 'WMS 維護',     status: 'queue',  task: '等候前一件審查結束', members: ['codex'], progress: 0 },
    { id: 'course',      name: '課程教材',     status: 'plan',   task: '排第一週學習單元', members: ['fable', 'gemini'], progress: 35 },
    { id: 'redteam',     name: '紅隊審查',     status: 'review', task: '逐條查證反方意見', members: ['opus', 'codex', 'gemini'], progress: 30 },
    { id: 'glossary',    name: '名詞表',       status: 'idle',   task: '沒有進行中的任務', members: ['haiku'], progress: 0 },
    { id: 'office',      name: 'AI 辦公室',    status: 'build',  task: '接上真實工作階段資料', members: ['lead', 'sonnet'], progress: 12 }
  ]
};
var NEXT_TASKS = ['整理待辦與驗收條件', '補齊測試案例', '重構舊模組', '更新說明文件', '對帳上週數字', '評估新做法'];

var agents = [], projects = [], byId = {};
var ui = { tab: 'p', filter: 'all', q: '', sel: null, paused: false, night: false, live: false };
/* 真實資料模式下的狀態用語：工作階段沒有「計畫／審查」這種階段，只有在跑、等你、結束 */
var LIVE_LABEL = { build: '工作中', plan: '計畫中', review: '待審查', wait: '等你回覆', stuck: '失敗', queue: '排隊', idle: '已完成' };
var LIVE_FILTER = { wait: '等你回覆', stuck: '失敗', rest: '已完成' };
function lab(s) { return ui.live ? LIVE_LABEL[s] : STATUS[s].label; }
function occupied(p) { return STATUS[p.status].active || (ui.live && p.status === 'wait'); }
function ago(iso) {
  var m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (!(m >= 0)) return '';
  if (m < 1) return '剛剛'; if (m < 60) return m + ' 分鐘前'; if (m < 1440) return Math.round(m / 60) + ' 小時前';
  return Math.round(m / 1440) + ' 天前';
}

function $(id) { return document.getElementById(id); }
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function cssVar(name) { return 'var(' + name + ')'; }
function now() { return new Date().toTimeString().slice(0, 5); }
function rnd(a, b) { return a + Math.random() * (b - a); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function loadData(d) {
  ui.live = !!d.live;
  agents = d.agents.map(function (a) { return Object.assign({}, a); });
  projects = d.projects.map(function (p) {
    var q = Object.assign({ progress: 0, members: [], task: '' }, p);
    if (!STATUS[q.status]) q.status = 'idle';
    q.log = (p.log || [{ t: now(), m: q.task ? '開始追蹤：' + q.task : '開始追蹤' }]).slice();
    return q;
  });
  byId = {};
  agents.forEach(function (a) { byId[a.id] = a; });
  projects.forEach(function (p) { byId[p.id] = p; });
}

/* ───────── 3D 場景 ───────── */
var canvas = $('scene');
var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
var scene = new THREE.Scene();
var camera = new THREE.PerspectiveCamera(32, 1, 1, 600);

var SKY_DAY = new THREE.Color(0xa9d8ee), SKY_NIGHT = new THREE.Color(0x0e1830);
scene.background = SKY_DAY.clone();
scene.fog = new THREE.Fog(SKY_DAY.getHex(), 140, 420);

var hemi = new THREE.HemisphereLight(0xffffff, 0x8aa07a, 0.5);
scene.add(hemi);
var sun = new THREE.DirectionalLight(0xfff2dd, 0.62);
sun.position.set(30, 50, 22);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
var sc = sun.shadow.camera; sc.left = -40; sc.right = 40; sc.top = 40; sc.bottom = -40; sc.near = 1; sc.far = 140;
sun.shadow.bias = -0.0005;
scene.add(sun);
var nightLights = [];
[[0, 5, 0, 1.4, 34], [-15, 4, -15, 0.9, 26], [15, 4, -15, 0.9, 26], [-15, 4, 15, 0.9, 26], [15, 4, 15, 0.9, 26]].forEach(function (c) {
  var l = new THREE.PointLight(0xffc98a, 0, c[4], 1.6);
  l.position.set(c[0], c[1], c[2]); l.userData.max = c[3];
  scene.add(l); nightLights.push(l);
});

var mats = {};
function mat(hex, opt) {
  var k = hex + JSON.stringify(opt || {});
  if (!mats[k]) mats[k] = new THREE.MeshStandardMaterial(Object.assign({ color: hex, roughness: 0.9, metalness: 0 }, opt || {}));
  return mats[k];
}
function add(parent, geo, material, x, y, z, noCast) {
  var m = new THREE.Mesh(geo, material);
  m.position.set(x, y, z); m.castShadow = !noCast; m.receiveShadow = true;
  parent.add(m); return m;
}
var geoCache = {};
function box(w, h, d) { var k = 'b' + w + ',' + h + ',' + d; return geoCache[k] || (geoCache[k] = new THREE.BoxGeometry(w, h, d)); }
function cyl(rt, rb, h, s) { var k = 'c' + rt + ',' + rb + ',' + h + ',' + s; return geoCache[k] || (geoCache[k] = new THREE.CylinderGeometry(rt, rb, h, s || 16)); }

/* 模擬：示範資料會自己往前跑，接上真實資料後這段可以關掉 */
function tick() {
  projects.forEach(function (p) {
    if (!STATUS[p.status].active) return;
    if (p.status === 'build' && Math.random() < 0.006) return setStatus(p, 'stuck', null, '外部服務沒回應，卡住了');
    p.progress = Math.min(100, p.progress + rnd(0.6, 2.6));
    if (p.progress < 100) return;
    if (p.status === 'plan') { p.progress = 0; setStatus(p, 'build', null, '計畫完成，開始實作'); }
    else if (p.status === 'build') { p.progress = 0; setStatus(p, 'review', null, '實作完成，送交審查'); }
    else setStatus(p, 'wait', '審查通過，等你按下批准', '審查通過，等你批准');
  });

}

/* ───────── 主迴圈 ───────── */
var nightK = 0, simT = 0, last = performance.now(), tmpC = new THREE.Color();
function frame(t) {
  var dt = Math.min(0.05, (t - last) / 1000); last = t;
  clampGoal(); applyCam(dt);
  nightK += ((ui.night ? 1 : 0) - nightK) * (1 - Math.exp(-dt * 3));
  tmpC.copy(SKY_DAY).lerp(SKY_NIGHT, nightK); scene.background.copy(tmpC); scene.fog.color.copy(tmpC);
  hemi.intensity = 0.5 - 0.3 * nightK; sun.intensity = 0.62 - 0.46 * nightK; sun.color.setHex(0xfff2dd).lerp(tmpC.setHex(0x9db8ff), nightK);
  nightLights.forEach(function (l) { l.intensity = l.userData.max * nightK; });
  stars.material.opacity = nightK; screenMat.emissiveIntensity = 0.35 + 0.9 * nightK; lampMat.emissiveIntensity = 1.4 * nightK;
  projects.forEach(function (p) { if (rooms[p.id]) rooms[p.id].tint.emissiveIntensity = 0.25 + 0.75 * nightK; });
  if (!ui.paused) {
    simT += dt; if (simT > 2.2) { simT = 0; if (!ui.live) tick(); }
    clouds.forEach(function (c) { c.position.x += c.userData.v * dt; if (c.position.x > 100) c.position.x = -100; });
    var moved = false;
    agents.forEach(function (a, i) {
      var g = a.g, s = a.seat;
      if (a.walking) {
        var dx = s.x - g.position.x, dz = s.z - g.position.z, d = Math.hypot(dx, dz), step = 7 * dt;
        if (d <= step) { g.position.x = s.x; g.position.z = s.z; g.position.y = 0.16; g.rotation.y = s.ry; a.walking = false; moved = true; }
        else { g.position.x += dx / d * step; g.position.z += dz / d * step; g.rotation.y = Math.atan2(dx, dz); g.position.y = 0.16 + Math.abs(Math.sin(t * 0.012 + i)) * 0.3; }
      } else {
        g.position.y = 0.16 + (a.at ? Math.abs(Math.sin(t * 0.004 + i * 1.7)) * 0.06 : 0);
        a.nextMove -= dt; if (a.nextMove <= 0) { var was = a.at; retarget(a); if (a.at !== was) moved = true; }
      }
    });
    if (moved) { renderList(); renderDetail(); }
  }
  renderer.render(scene, camera);
  placeLabels();
  requestAnimationFrame(frame);
}

var SLOTS = [];

  officeObjs.forEach(function (o) { scene.remove(o); }); officeObjs.length = 0; pickables.length = 0;

  plaza.forEach(function (s) { s.by = null; });
}
var sig = null;

  if (s === sig) {                                   // 房間沒變，只更新內容，角色不用重站位
    d.projects.forEach(function (n) {

    agents.forEach(function (a) { a.g = buildAgent(a); a.at = undefined; a.seat = null; retarget(a, true); a.nextMove = rnd(3, 14); addLabel('agent', a.id, a.name, a.color); });

/* 雲端：透過 Claude Code Remote 連接器讀工作階段清單（只在 claude.ai 的 Artifact 裡有效） */
var SERVER = 'Claude Code Remote', models = {}, noDetail = false, showingCloud = false;
var PRESET = {
  fable:  { name: 'Fable',  color: '#3f9b54', gear: 'leaf' },
  opus:   { name: 'Opus',   color: '#c0446b', gear: 'glasses' },
  sonnet: { name: 'Sonnet', color: '#2f74d0', gear: 'antenna' },
  haiku:  { name: 'Haiku',  color: '#d9a21b', gear: 'bow' },
  claude: { name: 'Claude', color: '#b5673a', gear: 'cap' }

    if (!seen[fam]) { seen[fam] = 1; ags.push(Object.assign({ id: fam, role: models[s.id] || '模型未知' }, PRESET[fam])); }
    return {
      id: s.id, name: s.title || '未命名的工作階段', status: st, members: [fam], updated: s.updated_at,
      task: sum.needs_action || sum.status_detail || sum.recent_action || (st === 'build' ? '正在工作中' : ''),
      kind: s.environment_kind === 'bridge' ? '本機（Remote Control）' : '雲端',
      url: /^session_[A-Za-z0-9]+$/.test(s.id) ? 'https://claude.ai/code/' + s.id : null

  });

}
/* 每一步的結果都記在 diag，讀不到資料時連同原因一起顯示在畫面上，不默默退回示範資料 */
var diag = {}, localOk = false, watching = false;
function diagText() { return '診斷：' + Object.keys(diag).map(function (k) { return k + '＝' + diag[k]; }).join('；'); }
function cloudNote(text, btn, fn, extra) { if (!localOk) note(text, btn, fn, diagText(), extra); }
function connectCloud() {
  var framed = false; try { framed = window.top !== window; } catch (e) { framed = true; }

    diag['頁面環境'] = '沒有 window.claude';
    if (framed) cloudNote('這個檢視環境沒有提供連接器功能，所以只能顯示示範資料。請在 claude.ai 網頁版或桌面版直接開啟這個 Artifact。');
    return;
  }
  diag['頁面環境'] = '有 window.claude';
  cloudNote('正在連接你的雲端工作階段（最多等 10 秒）…');
  var use = function (n) { return Promise.resolve().then(function () { return window.claude.use(n); }).catch(function () { return null; }); };
  Promise.all([use('mcp'), use('permissions')]).then(function (got) {
    var mcp = got[0], perms = got[1], key = 'mcp:' + SERVER;
    if (!mcp) {
      diag['連接器功能'] = '未提供';
      return cloudNote('這個檢視環境沒有把連接器功能交給頁面，所以沒有跳出詢問，只能顯示示範資料。請在 claude.ai 網頁版或桌面版直接開啟這個 Artifact 再試。', '再試一次', connectCloud);
    }
    diag['連接器功能'] = '可用';

    function onResult(result) {
      var body = unwrap(result.payload), list = body && (Array.isArray(body.data) ? body.data : Array.isArray(body) ? body : null);
      if (!list) { diag['回應'] = '格式不符'; return cloudNote('連接器有回應，但資料格式和預期不同，目前顯示示範資料。', '再試一次', ask); }
      diag['回應'] = list.length + ' 筆';
      list = list.filter(function (s) { return s && s.id && s.session_status !== 'SESSION_STATUS_ARCHIVED'; })
        .sort(function (a, b) { return String(b.updated_at).localeCompare(String(a.updated_at)); }).slice(0, SLOTS.length)
        .sort(function (a, b) { return String(b.created_at).localeCompare(String(a.created_at)); });
      var stamp = '雲端即時・' + hhmm((result.cache && result.cache.storedAt) || Date.now());

      else if (c === 'server_not_connected' || c === 'server_not_found' || c === 'selection_required') demo('你的帳號找不到可用的 Claude Code Remote 連接器：到 claude.ai 設定 → 連接器加入或選定它後再試。目前顯示示範資料。', '再試一次', ask);
      else if (c === 'approval_required' || c === 'consent_required') demo('需要你允許，這個頁面才能讀取工作階段。', '允許讀取', ask);
      else if (c === 'not_in_manifest' && diag['有列出工作階段工具'] === '否') demo('你的 Claude Code Remote 連接器在這個頁面裡沒有提供「列出工作階段」的工具，所以頁面本身讀不到工作階段。目前顯示示範資料。');
      else if (c === 'not_in_manifest') demo('這個頁面沒有獲准使用 Claude Code Remote（可能之前按了拒絕，或你的連接器沒有「列出工作階段」這個工具）。目前顯示示範資料。', perms ? '開啟權限設定' : '再試一次', perms ? manage : ask);
      else if (c === 'blocked_by_policy') demo('你的組織政策不允許這個頁面讀取工作階段，目前顯示示範資料。');
      else if (c === 'not_granted' || c === 'capability_disabled' || c === 'capability_removed') demo('這個檢視環境沒有開放連接器功能，目前顯示示範資料。請在 claude.ai 網頁版或桌面版直接開啟這個 Artifact。', '再試一次', ask);

      else if (c === 'upstream_error' && !showingCloud) demo('授權詢問沒有成功顯示，連接器還沒被允許，所以讀不到。請按「允許讀取」；如果按了還是沒有跳出詢問，代表這個檢視畫面不能顯示詢問，請按「開啟權限設定」，或改用瀏覽器在 claude.ai 開啟這個 Artifact 的完整頁面。', '允許讀取', ask, perms ? ['開啟權限設定', manage] : null);

        if (diag['授權狀態'] === 'denied') return demo('你拒絕了這個頁面使用 Claude Code Remote，所以顯示示範資料。要改變主意，請從權限設定重新開啟。', '開啟權限設定', manage);

    function manage() { perms.manage().then(ask, function () { cloudNote('打不開權限設定。請從這個 Artifact 右上角選單的「權限」把 Claude Code Remote 打開，再重新整理。', '再試一次', ask); }); }
